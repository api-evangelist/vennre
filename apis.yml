name: Vennre
description: >-
  Vennre is a Sharia-compliant private-market investing platform built for HENRYs
  (High Earners, Not Rich Yet). It curates and vets institutional-grade
  opportunities across real estate, private equity, venture capital and private
  credit from leading global managers, lowering entry thresholds so members can
  start building wealth from as little as $5,000. Delivered through a mobile app
  and web experience with a smart wallet, portfolio tracking and personalized
  wealth coaching, the platform is regulated in the UK as an appointed
  representative of Talbot Capital Ltd (FCA FRN 489839) and operates in Saudi
  Arabia under the Capital Market Authority (CMA License 19206-20). Vennre is a
  consumer wealthtech product; no public developer API or developer platform is
  published at this time.
